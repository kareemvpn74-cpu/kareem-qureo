<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10152f">
<title>KAREEM QUREO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#263b86,#111936 48%,#090d1d);color:white;display:grid;place-items:center;padding:22px}
main{width:min(100%,440px);background:#ffffff12;border:1px solid #ffffff26;border-radius:24px;padding:28px;box-shadow:0 18px 55px #0007}
.mark{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#19c8ff,#7654ff);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
h1{text-align:center;margin:0;font-size:28px}.sub{text-align:center;color:#c7d2fe;margin:8px 0 26px}
label{display:block;margin-bottom:9px;font-weight:700}select{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff45;background:#151e42;color:white;font-size:16px;margin-bottom:18px}
a{display:block;text-align:center;text-decoration:none;background:linear-gradient(90deg,#12bde9,#6556f5);color:white;padding:15px;border-radius:14px;font-weight:800}
.note{font-size:13px;line-height:1.8;color:#d6dcf4;margin:18px 0 0}
</style>
</head>
<body><main>
<div class="mark">Q</div><h1>KAREEM QUREO</h1>
<p class="sub">مساعدك للوصول إلى منصة كيريو</p>
<label for="grade">اختار الصف الدراسي</label>
<select id="grade"><option value="">اختر الصف</option><option>الأول الثانوي</option><option>الثاني الثانوي</option><option>الثالث الثانوي</option></select>
<a href="https://me-portal.qureo.education/login" target="_blank" rel="noopener noreferrer">الدخول إلى منصة كيريو الرسمية</a>
<p class="note">تسجيل الدخول يتم على موقع كيريو الرسمي فقط. لا تكتب كلمة المرور أو رقم الهاتف في هذه الصفحة، ولا تشارك بيانات حسابك مع أي شخص.</p>
</main></body></html>
